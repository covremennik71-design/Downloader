name: Downloader checks
on:
  push:
    branches: ["master", "fix/**", "audit/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python source files
        run: python -m compileall -q .
      - name: Run URL validation tests
        run: python -m unittest discover -s tests -v
  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: node --check app/src/main.js
  rust-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate Cargo.lock from the manifest
        working-directory: app/src-tauri
        run: cargo generate-lockfile
      - name: Commit the regenerated lockfile to this audit branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/audit/runtime-build-hardening'
        shell: bash
        run: |
          if git diff --quiet -- app/src-tauri/Cargo.lock; then
            echo "Cargo.lock is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src-tauri/Cargo.lock
          git commit -m "chore: sync Cargo.lock with manifest"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Check Tauri backend with the generated lockfile
        run: cargo check --manifest-path app/src-tauri/Cargo.toml --locked
