name: Downloader checks
on:
  push:
    branches: ["master", "fix/**"]
  pull_request:
  workflow_dispatch:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python source files
        run: python -m compileall -q .
      - name: Run URL validation tests
        run: python -m unittest discover -s tests -v
  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: node --check app/src/main.js
  rust-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate Cargo.lock from the manifest
        working-directory: app/src-tauri
        run: cargo generate-lockfile
      - name: Check Tauri backend with the generated lockfile
        run: cargo check --manifest-path app/src-tauri/Cargo.toml --locked
      - name: Publish regenerated Cargo.lock for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-cargo-lock
          path: app/src-tauri/Cargo.lock
          if-no-files-found: error
